name: signspeak
description: "SignSpeak — Real-Time Sign Language Translator"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.11.1
  flutter_tts: ^4.2.0
  google_fonts: ^6.2.1
  web_socket_channel: ^3.0.2
  image: ^4.5.3
  http: ^1.2.2          # ← NEW: for Gemini API calls

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0d0d18"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  web:
    generate: false
